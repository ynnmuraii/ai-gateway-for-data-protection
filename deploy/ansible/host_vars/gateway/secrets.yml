---
# Sensitive values are read from the environment at runtime.
# GitHub Actions supplies them from the "production" environment secrets;
# local runs must export them before invoking ansible-playbook.
#
# Never replace these lookups with literal secrets. If a static encrypted
# source is required, use ansible-vault instead of plaintext host_vars.
postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
gateway_runtime_password: "{{ lookup('env', 'GATEWAY_RUNTIME_PASSWORD') }}"
gateway_csrf_secret: "{{ lookup('env', 'GATEWAY_CSRF_SECRET') }}"
gateway_pseudonym_secret: "{{ lookup('env', 'GATEWAY_PSEUDONYM_SECRET') }}"
gateway_identity_secret: "{{ lookup('env', 'GATEWAY_IDENTITY_SECRET') }}"
gateway_bootstrap_password: "{{ lookup('env', 'GATEWAY_BOOTSTRAP_PASSWORD') }}"
gateway_bootstrap_integration_key: "{{ lookup('env', 'GATEWAY_BOOTSTRAP_INTEGRATION_KEY') }}"
gateway_provider_secret: "{{ lookup('env', 'GATEWAY_PROVIDER_SECRET') | default('', true) }}"
webui_secret_key: "{{ lookup('env', 'WEBUI_SECRET_KEY') }}"
webui_admin_password: "{{ lookup('env', 'WEBUI_ADMIN_PASSWORD') }}"
webui_user_password: "{{ lookup('env', 'WEBUI_USER_PASSWORD') }}"
