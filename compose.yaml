name: confidential-ai-gateway

x-gateway-environment: &gateway-environment
  GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:?Run scripts/prepare-compose.py first}
  GATEWAY_PUBLIC_ORIGIN: ${GATEWAY_PUBLIC_ORIGIN:-http://localhost:8080}
  GATEWAY_DEMO_MODE: ${GATEWAY_DEMO_MODE:-true}
  GATEWAY_PROVIDER_SECRET: ${GATEWAY_PROVIDER_SECRET:-}
  GATEWAY_PROVIDER_SECRET_REF: ${GATEWAY_PROVIDER_SECRET_REF:-provider-default}
  GATEWAY_PROVIDER_ALLOWED_HOSTS: ${GATEWAY_PROVIDER_ALLOWED_HOSTS:-api.openai.com}
  GATEWAY_PROVIDER_BASE_URL: ${GATEWAY_PROVIDER_BASE_URL:-https://api.openai.com/v1}
  GATEWAY_PROVIDER_LABEL: ${GATEWAY_PROVIDER_LABEL:-OpenAI}
  GATEWAY_PROVIDER_MODEL: ${GATEWAY_PROVIDER_MODEL:-gpt-4o-mini}
  GATEWAY_CSRF_SECRET: ${GATEWAY_CSRF_SECRET:?Required}
  GATEWAY_PSEUDONYM_SECRET: ${GATEWAY_PSEUDONYM_SECRET:?Required}
  GATEWAY_IDENTITY_SECRET: ${GATEWAY_IDENTITY_SECRET:?Required}

services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    env_file: [./deploy/env/postgres.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gateway_owner -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  install:
    image: ${GATEWAY_IMAGE:-confidential-ai-gateway:local}
    build: .
    env_file: [./deploy/env/gateway.env]
    environment:
      <<: *gateway-environment
      GATEWAY_INSTALL_DATABASE_URL: ${GATEWAY_INSTALL_DATABASE_URL:?Required}
      GATEWAY_RUNTIME_PASSWORD: ${GATEWAY_RUNTIME_PASSWORD:?Required}
      GATEWAY_BOOTSTRAP_USERNAME: ${GATEWAY_BOOTSTRAP_USERNAME:-admin}
      GATEWAY_BOOTSTRAP_PASSWORD: ${GATEWAY_BOOTSTRAP_PASSWORD:?Required}
      GATEWAY_BOOTSTRAP_INTEGRATION_KEY: ${GATEWAY_BOOTSTRAP_INTEGRATION_KEY:?Required}
    command: [python, scripts/bootstrap-compose.py]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  gateway:
    image: ${GATEWAY_IMAGE:-confidential-ai-gateway:local}
    build: .
    env_file: [./deploy/env/gateway.env]
    environment: *gateway-environment
    depends_on:
      install: {condition: service_completed_successfully}
    networks: [private, provider-egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.4-slim@sha256:0487ad4a5a4b986062dedace806c3ef1e88fec38c10d1e64d6a5501c66671e5e
    env_file: [./deploy/env/openwebui.env]
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Required}
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL:-http://localhost:3000}
      OPENAI_API_KEYS: ${GATEWAY_BOOTSTRAP_INTEGRATION_KEY:?Required}
      DEFAULT_MODELS: ${GATEWAY_CHAT_MODEL:-demo-model}
      FORWARD_USER_INFO_HEADER_JWT_SECRET: ${GATEWAY_IDENTITY_SECRET:?Required}
    volumes: [openwebui-data:/app/backend/data]
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports: ["127.0.0.1:${GATEWAY_ADMIN_PORT:-8080}:80", "127.0.0.1:${GATEWAY_CHAT_PORT:-3000}:3000"]
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on:
      gateway: {condition: service_healthy}
      openwebui: {condition: service_healthy}
    networks: [private, listeners]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:80/health/live]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  connect-openwebui:
    profiles: [tools]
    image: ${GATEWAY_IMAGE:-confidential-ai-gateway:local}
    env_file: [./deploy/env/gateway.env]
    environment:
      <<: *gateway-environment
      GATEWAY_INSTALL_DATABASE_URL: ${GATEWAY_INSTALL_DATABASE_URL:?Required}
      GATEWAY_BOOTSTRAP_INTEGRATION_KEY: ${GATEWAY_BOOTSTRAP_INTEGRATION_KEY:?Required}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?Required}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?Required}
      WEBUI_USER_EMAIL: ${WEBUI_USER_EMAIL:?Required}
      WEBUI_USER_PASSWORD: ${WEBUI_USER_PASSWORD:?Required}
    command: [python, scripts/connect-openwebui.py, --internal, --url, http://openwebui:8080, --verify-live]
    depends_on:
      gateway: {condition: service_healthy}
      openwebui: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  upgrade-detector:
    profiles: [tools]
    image: ${GATEWAY_IMAGE:-confidential-ai-gateway:local}
    env_file: [./deploy/env/gateway.env]
    environment:
      <<: *gateway-environment
      GATEWAY_DATABASE_URL: ${GATEWAY_INSTALL_DATABASE_URL:?Required}
    command: [python, -m, gateway.cli, upgrade-detector, --username, "${GATEWAY_BOOTSTRAP_USERNAME:-admin}"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  openwebui-data:

networks:
  private: {internal: true}
  provider-egress:
  listeners:
