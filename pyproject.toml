[project]
name = "ai-gateway-for-data-protection"
version = "0.1.0"
description = "Local confidential-data gateway for OpenAI-compatible chat clients"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.9,<3",
  "presidio-analyzer>=2.2,<3",
  "phonenumbers>=8.13,<10",
  "spacy>=3.8,<3.9",
  "en-core-web-sm",
  "ru-core-news-sm",
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "PyYAML>=6,<7", "respx>=0.22,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/gateway"]
[tool.hatch.build.targets.wheel.force-include]
"backend/migrations" = "gateway/migrations"
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
ru-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl" }
